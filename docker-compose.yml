version: '3.9'

# =============================================================
# RedeApoio — Docker Swarm Stack
# Imagem buildada localmente no servidor com build.sh
# Deploy via Portainer — domínio definido em ${DOMAIN}
#
# Pré-requisitos (já existentes no servidor, compartilhados com outras stacks
# como o gtw-banners e o gtw-platform):
#   - rede externa "network_public" (criada pela stack do Traefik)
#   - resolver Let's Encrypt "letsencryptresolver" configurado no Traefik
# =============================================================

networks:
  network_public:
    external: true
  redeapoio_internal:
    driver: overlay
    internal: true   # Postgres não fica exposto diretamente

volumes:
  redeapoio_pgdata:
    driver: local

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  redeapoio-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       redeapoio
      POSTGRES_USER:     redeapoio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - redeapoio_pgdata:/var/lib/postgresql/data
    networks:
      - redeapoio_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M

  # ── App (backend + frontend estático em um único container) ─
  redeapoio-app:
    image: redeapoio-app:latest
    environment:
      NODE_ENV:    production
      PORT:        "3000"
      # Variáveis discretas em vez de uma DATABASE_URL montada por interpolação:
      # se a senha tiver caracteres como / @ : # (comuns em senhas fortes geradas
      # aleatoriamente), eles quebrariam o parser de URL de conexão.
      PGHOST:      redeapoio-postgres
      PGPORT:      "5432"
      PGUSER:      redeapoio
      PGPASSWORD:  ${DB_PASSWORD}
      PGDATABASE:  redeapoio
      JWT_SECRET:  ${JWT_SECRET}
      PUBLIC_URL:  https://${DOMAIN}
      # E-mail transacional (recuperação de senha) — Hostinger SMTP, mesmo padrão
      # já usado no gtw-platform/gtw-imobi.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Só necessárias para rodar migrate.sh (importação única do Supabase).
      # Adicione no Portainer só na hora da migração; depois de rodar e
      # rotacionar a service_role key no Supabase, remova estas duas daqui
      # e atualize a stack de novo — elas não servem para mais nada depois disso.
      SUPABASE_URL:         ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
    networks:
      - network_public
      - redeapoio_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.redeapoio.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.redeapoio.entrypoints=websecure"
        - "traefik.http.routers.redeapoio.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.redeapoio.loadbalancer.server.port=3000"
